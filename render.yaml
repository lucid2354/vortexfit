# Тестовый запуск на бесплатном Render: SQLite и фото на временном диске,
# всё пропадает при перезапуске и «засыпании». Для настоящего сайта так не оставляй.
services:
  - type: web
    name: vortexfit
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SERVE_MEDIA
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
